<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iris Flower Classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f2f4f7, #d9e4f5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-in;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        form:hover {
            transform: scale(1.02);
        }

        input[type="number"] {
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            transition: all 0.2s ease-in-out;
        }

        input[type="number"]:hover {
            border-color: #4a90e2;
            box-shadow: 0 0 5px #4a90e2aa;
        }

        button {
            padding: 12px 30px;
            background-color: #4a90e2;
            border: none;
            color: white;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #357ABD;
            transform: scale(1.05);
        }

        h2 {
            margin-top: 20px;
            background: #dff0d8;
            color: #3c763d;
            padding: 15px 20px;
            border-radius: 10px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>🌸 Iris Flower Classifier</h1>
    <form method="post">
        <input type="number" name="sepal_length" placeholder="Sepal Length (cm)" step="0.1" required><br>
        <input type="number" name="sepal_width" placeholder="Sepal Width (cm)" step="0.1" required><br>
        <input type="number" name="petal_length" placeholder="Petal Length (cm)" step="0.1" required><br>
        <input type="number" name="petal_width" placeholder="Petal Width (cm)" step="0.1" required><br>
        <button type="submit">🔍 Predict</button>
    </form>
    
    {% if prediction %}
        <h2>Prediction: 🌼 <strong>{{ prediction }}</strong></h2>
    {% endif %}
</body>
</html>
